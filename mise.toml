[tools]
rust = { version = "stable", components = "rustfmt,clippy" }
node = "24"
watchexec = "2"

[tasks.install]
description = "Install frontend dependencies"
dir = "frontend"
run = "npm ci"

[tasks.build-frontend]
description = "Build the frontend into frontend/dist"
depends = ["install"]
dir = "frontend"
run = "npm run build"

[tasks.dev]
description = "Run Workshop, rebuilding and restarting on changes; refresh the page to pick them up"
depends = ["build-frontend"]
run = "scripts/dev.sh"

[tasks.serve]
description = "Run an optimised build for your phone over Tailscale, keeping this machine awake"
depends = ["build-frontend"]
usage = 'flag "--https-port <port>" help="The HTTPS port to serve on, if not where Tailscale already serves Workshop or 443"'
run = '''
tailscale status >/dev/null 2>&1 || tailscale up
set -- cargo run --release -- serve --tailscale
if [ -n "${usage_https_port:-}" ]; then
  set -- "$@" --https-port "$usage_https_port"
fi
if command -v caffeinate >/dev/null 2>&1; then
  exec caffeinate -i "$@"
else
  exec "$@"
fi
'''

[tasks.eval]
description = "Check the edit model against the cases in evals/ (makes real model calls)"
run = "cargo run --quiet -- eval"

[tasks.build]
description = "Build the release binary with the frontend embedded"
depends = ["build-frontend"]
run = "cargo build --release"

[tasks.check-fast]
description = "Run the checks that take seconds: formatting, lints, types and unit tests"
depends = ["install"]
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
  "cd frontend && npm run typecheck && npm run lint && npm test",
]

[tasks.check]
description = "Run all the checks CI runs, including the browser tests"
depends = ["check-fast", "build-frontend"]
run = "cargo build && cd frontend && npm run e2e && npm run e2e:webkit"

[tasks.check-packages]
description = "Check installing packages with the real toolchains (needs the network)"
depends = ["build-frontend"]
run = "cargo build && cd frontend && node scripts/check-packages.ts"

[tasks.check-languages]
description = "Check each language with its real toolchain and language server (needs each language's programs)"
depends = ["build-frontend"]
run = "cargo build && cd frontend && node scripts/check-languages.ts"

[tasks.check-dictation]
description = "Check dictation with Whisper on real recorded speech (needs whisper-cli, the small.en model, say and ffmpeg)"
depends = ["build-frontend"]
run = "cargo build && cd frontend && node scripts/check-dictation.ts"

[tasks.demo]
description = "Record docs/demo.gif on an emulated phone (makes real calls to your edit model)"
depends = ["build-frontend"]
run = "cargo build && cd frontend && node demo/record.ts"

[tasks.doctor]
description = "Check your setup"
run = "cargo run -- doctor"
