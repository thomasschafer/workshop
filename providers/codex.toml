# OpenAI's Codex CLI, using the user's existing ChatGPT login.
#
# Codex has no way to run without tools, so every tool that can be is switched off, it runs in
# its read-only sandbox in an empty directory with approvals turned off, and Workshop stops it
# (and makes no edit) the moment it starts using any tool. Its own instruction files and user
# config are skipped so they can't change its behaviour.
command = [
  "codex", "exec",
  "--json",
  "--ephemeral",
  "--skip-git-repo-check",
  "--ignore-user-config",
  "--ignore-rules",
  "--sandbox", "read-only",
  "--model", "{model}",
  "-c", "approval_policy=\"never\"",
  "-c", "developer_instructions={system_prompt:toml}",
  "-c", "model_reasoning_effort=\"low\"",
  "-c", "project_doc_max_bytes=0",
  "-c", "web_search=\"disabled\"",
  "-c", "features.shell_tool=false",
  "-c", "features.unified_exec=false",
  "-c", "features.multi_agent=false",
  "-c", "features.plugins=false",
  "-c", "features.apps=false",
  "-c", "features.hooks=false",
  "-c", "features.browser_use=false",
  "-c", "features.browser_use_external=false",
  "-c", "features.in_app_browser=false",
  "-c", "features.computer_use=false",
  "-c", "features.image_generation=false",
  "-c", "features.code_mode_host=false",
  "-c", "features.goals=false",
  "-c", "features.tool_suggest=false",
  "-c", "features.personality=false",
  "-",
]
input = "stdin"
output = "codex-json"
prespawn = true
version_command = ["codex", "--version"]
auth_check_command = ["codex", "login", "status"]
install_hint = "Install Codex (https://developers.openai.com/codex), then run `codex login`."
# Lets a family name such as "luna" always mean the newest model in that family.
model_catalog = ["codex", "debug", "models"]
