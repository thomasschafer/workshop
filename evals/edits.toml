# Edit eval cases: run with `workshop eval` (or `mise run eval`). Each case is one call to the
# edit model, so this isn't run in CI. `‸` marks the cursor. All code here is invented; never use
# real Advent of Code puzzles or inputs.
#
# `after` is the expected file, with the cursor where the user would naturally continue; `also`
# lists other results that are just as good. `unsure = true` means the model should make no edit.

# Building expressions right to left

[[case]]
name = "before-that-operator"
utterance = "before that dot"
before = "solve = sum‸"
recent = "sum"
after = "solve = ‸. sum"
also = ["solve = ‸ . sum"]

