# Workshop configuration. Every setting is optional; the values shown are the defaults.

[server]
# Workshop runs code and spends your model subscription, so it only listens on this machine by
# default. To reach it from your phone, use `tailscale serve` (see the README), which also gives
# you the HTTPS that browsers require for microphone access.
bind = "127.0.0.1:7878"
# Check GitHub once a day for a newer release of Workshop, and say so in Settings when there is.
check_for_updates = true

[solutions]
# A git repo for your solutions. Created on first use if it doesn't exist.
dir = "~/aoc"
# "haskell", "python", "typescript", "go" or "rust", or a language you add below.
language = "haskell"
# Commit, and push if the repo has a remote, after each star. Can be changed in Settings.
commit_after_star = false

[aoc]
# Your session cookie is read from the AOC_SESSION environment variable, or from the
# `aoc-session` file next to this config file.
#
# Sent with every request to Advent of Code so they can contact the maintainers of this tool.
user_agent = "github.com/thomasschafer/workshop"

[run]
timeout_secs = 60

# "claude" uses Claude Code, "codex" uses OpenAI's Codex CLI and "antigravity" uses Google's
# Antigravity CLI, each with your existing login.
# Workshop chose whichever you had installed when it wrote this file. These are the defaults:
# you can switch in the app, under Settings, Models.
[models.edit]
provider = "claude"
# Aliases always mean the latest version: "haiku" for Claude, or a family name such as "luna"
# for Codex.
model = "haiku"

[models.discuss]
provider = "claude"
# The first is the default; you can switch between them in the app. For Codex, try
# ["sol", "astra"].
models = ["sonnet", "opus", "fable"]

# The grader, which marks work in your own words, design sessions and timed rounds, uses the
# discussion provider's first model unless it has one of its own, here or in the app, such as:
# [models.grader]
# provider = "codex"
# model = "sol"        # the provider's first discussion model if not given

[editor]
# The code editor's keybindings with a keyboard: "default", or "helix" for Helix's modal ones.
# Each device can choose for itself in the app, under Settings, Display.
keybindings = "default"

# Format the code with the language server, or the language's formatter, before each run, and
# with Helix's keybindings once it's been left in normal mode for a few seconds after a change.
format_automatically = true

# Helix's own options, named as in Helix's [editor] config, and its keymaps as in its [keys]
# tables, under [editor.helix.keys.normal], [editor.helix.keys.select] and
# [editor.helix.keys.insert]. These are the options Workshop follows, with Helix's defaults:
# [editor.helix]
# scrolloff = 5
# line-number = "absolute"    # or "relative"
# color-modes = false
# auto-pairs = true
# jump-label-alphabet = "abcdefghijklmnopqrstuvwxyz"
# smart-tab.enable = false    # Helix's default is true; without a syntax tree, Tab after text
#                             # moves past the closing bracket around the cursor instead
# search.smart-case = true
# search.wrap-around = true
# cursor-shape = { normal = "block", insert = "block", select = "block" }
#
# [editor.helix.keys.normal]
# X = "extend_line_above"
# C-s = ":w"

[learning]
# Packs of things to learn, each a directory (see docs/packs.md). Until you list one, Workshop
# uses its sample pack.
packs = []
# Whether to use the sample pack as well, alongside your own.
sample_pack = false
# The most reviews Continue offers in a day; any more wait for the next.
daily_reviews = 40
# The most new items Continue offers in a day, across every track; any more wait for the next.
daily_new = 10
# The minutes of practice to aim for each week, which the home screen counts towards.
weekly_minutes = 90
# How likely you should be to remember an item when it comes back, from 0.7 to 0.97. Higher means
# more reviews.
desired_retention = 0.9

# The author writes new items for your pack, for what you're weakest in and the mistakes you make
# most, from `workshop author` or the app's top-up button. It needs a pack of your own, and never
# pushes. See docs/author.md.
[author]
# Writes items, with its tools kept to a copy of your pack. "opus" is always the newest Opus.
writer = { provider = "claude", model = "opus" }
# Solves each item blind and reviews it, with no tools. Unset, it's the newest Sol through Codex
# if Codex is installed and logged in, and the writer's own provider and model otherwise. Another
# provider is better, as two runs of one model share its blind spots; see docs/author.md.
# reviewer = { provider = "codex", model = "sol" }
# reviewer = { provider = "antigravity", model = "gemini-4-neon-high" }
# The most new items a run writes.
max_items = 5
# Rounds of discussion when the two disagree, before an item waits for your approval in the app.
discussion_rounds = 2
# Rounds the writer gets to fix items whose checks fail.
fix_rounds = 2
# The longest a model may take over one turn.
timeout_minutes = 20
# To have the server run the author by itself, for each pack of your own: how often, as a number
# of hours, days or weeks, such as "7d", and optionally the time of day, on this computer's clock,
# to wait for, such as "02:00". Off unless set.
# every = "7d"
# after = "02:00"

# Snippets you can insert by saying "snippet <name>", or from the snippet menu.
# [[snippets]]
# name = "parse ints"
# body = "map read . lines"

# Override or add model providers. See CONTRIBUTING.md for the full format.
# [providers.my-cli]
# command = ["my-cli", "--model", "{model}", "--system", "{system_prompt}"]
# input = "stdin"
# output = "text"

# Override or add language profiles. See CONTRIBUTING.md and languages/haskell.toml.
# [languages.python]
# name = "Python"
# ...
