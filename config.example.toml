# Workshop configuration. Every setting is optional; the values shown are the defaults.

[server]
# Workshop runs code and spends your model subscription, so it only listens on this machine by
# default. To reach it from your phone, use `tailscale serve` (see the README), which also gives
# you the HTTPS that browsers require for microphone access.
bind = "127.0.0.1:7878"
# Check GitHub once a day for a newer release of Workshop, and say so in Settings when there is.
check_for_updates = true

[solutions]
# A git repo for your solutions. Created on first use if it doesn't exist.
dir = "~/aoc"
# "haskell", "python", "typescript", "go" or "rust", or a language you add below.
language = "haskell"
# Commit, and push if the repo has a remote, after each star. Can be changed in Settings.
commit_after_star = false

[aoc]
# Your session cookie is read from the AOC_SESSION environment variable, or from the
# `aoc-session` file next to this config file.
#
# Sent with every request to Advent of Code so they can contact the maintainers of this tool.
user_agent = "github.com/thomasschafer/workshop"

[run]
timeout_secs = 60

# "claude" uses Claude Code and "codex" uses OpenAI's Codex CLI, each with your existing login.
# Workshop chose whichever you had installed when it wrote this file. These are the defaults:
# you can switch in the app, under Settings, Models.
[models.edit]
provider = "claude"
# Aliases always mean the latest version: "haiku" for Claude, or a family name such as "luna"
# for Codex.
model = "haiku"

[models.discuss]
provider = "claude"
# The first is the default; you can switch between them in the app. For Codex, try
# ["sol", "astra"].
models = ["sonnet", "opus", "fable"]

# Snippets you can insert by saying "snippet <name>", or from the snippet menu.
# [[snippets]]
# name = "parse ints"
# body = "map read . lines"

# Override or add model providers. See CONTRIBUTING.md for the full format.
# [providers.my-cli]
# command = ["my-cli", "--model", "{model}", "--system", "{system_prompt}"]
# input = "stdin"
# output = "text"

# Override or add language profiles. See CONTRIBUTING.md and languages/haskell.toml.
# [languages.python]
# name = "Python"
# ...
