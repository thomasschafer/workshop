[package]
name = "workshop"
version = "0.8.1"
edition.workspace = true
description = "A learning and coding platform built for your phone, with Advent of Code built in"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["advent-of-code", "voice", "editor"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[workspace]
members = ["crates/*"]
# So `cargo test` and `cargo clippy` at the root cover the shared crates too.
default-members = [".", "crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thomasschafer/workshop"

[workspace.dependencies]
workshop-auth = { path = "crates/auth" }
workshop-author = { path = "crates/author" }
workshop-coding = { path = "crates/coding" }
workshop-common = { path = "crates/common" }
workshop-learning = { path = "crates/learning" }
workshop-lsp = { path = "crates/lsp" }
workshop-pack = { path = "crates/pack" }
workshop-provider = { path = "crates/provider" }
workshop-push = { path = "crates/push" }
workshop-runner = { path = "crates/runner" }
workshop-sessions = { path = "crates/sessions" }
workshop-tailscale = { path = "crates/tailscale" }
workshop-toolchain = { path = "crates/toolchain" }
workshop-tracks = { path = "crates/tracks" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
fsrs = { version = "7.0.0", default-features = false }
futures-util = "0.3.34"
jiff = "0.2.38"
libc = "0.2.190"
mime_guess = "2.0.5"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
regex = "1.13.1"
rhai = { version = "1.27.0", features = ["no_module", "only_i64"] }
roxmltree = "0.21.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form", "gzip", "http2", "multipart"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rust-embed = "8.13.0"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
shell-words = "1.1.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
web-push-native = "0.5"

[dependencies]
workshop-auth.workspace = true
workshop-author.workspace = true
workshop-coding.workspace = true
workshop-common.workspace = true
workshop-learning.workspace = true
workshop-lsp.workspace = true
workshop-pack.workspace = true
workshop-provider.workspace = true
workshop-push.workspace = true
workshop-runner.workspace = true
workshop-sessions.workspace = true
workshop-tailscale.workspace = true
workshop-toolchain.workspace = true
workshop-tracks.workspace = true

anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
dirs.workspace = true
futures-util.workspace = true
jiff.workspace = true
mime_guess.workspace = true
qrcode.workspace = true
regex.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shell-words.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
urlencoding.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
tokio-tungstenite = "0.29.0"
tower.workspace = true

# Pack checks run thousands of simulated trials, which an unoptimised script engine makes slow in
# tests and debug builds.
[profile.dev.package.rhai]
opt-level = 3
