[package]
name = "workshop"
version = "0.7.0"
edition = "2024"
description = "Solve Advent of Code puzzles by voice, from your phone"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thomasschafer/workshop"
readme = "README.md"
keywords = ["advent-of-code", "voice", "editor"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
mime_guess = "2.0.5"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form", "gzip", "http2", "multipart"] }
rust-embed = "8.13.0"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
web-push-native = "0.5"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"
