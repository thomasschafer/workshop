[package]
name = "workshop"
version = "0.8.1"
edition.workspace = true
description = "Solve Advent of Code puzzles by voice, from your phone"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["advent-of-code", "voice", "editor"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[workspace]
members = ["crates/*"]
# So `cargo test` and `cargo clippy` at the root cover the shared crates too.
default-members = [".", "crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thomasschafer/workshop"

[workspace.dependencies]
workshop-auth = { path = "crates/auth" }
workshop-common = { path = "crates/common" }
workshop-lsp = { path = "crates/lsp" }
workshop-provider = { path = "crates/provider" }
workshop-push = { path = "crates/push" }
workshop-runner = { path = "crates/runner" }
workshop-tailscale = { path = "crates/tailscale" }
workshop-toolchain = { path = "crates/toolchain" }
workshop-tracks = { path = "crates/tracks" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
libc = "0.2.190"
mime_guess = "2.0.5"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form", "gzip", "http2", "multipart"] }
rust-embed = "8.13.0"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
web-push-native = "0.5"

[dependencies]
workshop-auth.workspace = true
workshop-common.workspace = true
workshop-lsp.workspace = true
workshop-provider.workspace = true
workshop-push.workspace = true
workshop-runner.workspace = true
workshop-tailscale.workspace = true
workshop-toolchain.workspace = true
workshop-tracks.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
dirs.workspace = true
futures-util.workspace = true
mime_guess.workspace = true
qrcode.workspace = true
regex.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
urlencoding.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
