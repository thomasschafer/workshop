name: Set up
description: Installs Rust and Node, and builds the frontend, which the binary embeds, so it must exist before any cargo build.
inputs:
  rust-components:
    description: Extra Rust components to install, such as "clippy, rustfmt".
    default: ""
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        toolchain: stable
        components: ${{ inputs.rust-components }}

    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      shell: bash
      working-directory: frontend
      run: |
        npm ci
        npm run build

    - name: Rust cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
