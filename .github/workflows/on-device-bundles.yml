# Reproducibly builds and optionally publishes the custom 10-package GHC 9.14 WASM on-device
# runtime bundle (`bsdtar.wasm`, `rootfs.tar.zst`, `SHA256SUMS`, `bundle-manifest.json`).
name: On-device bundles

on:
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version tag suffix (e.g. 9.14.0-workshop.1)
        required: true
        default: 9.14.0-workshop.1
        type: string
      ghc_wasm_flavour:
        description: ghc-wasm-meta FLAVOUR matching the rootfs GHC ABI
        required: true
        default: "9.14"
        type: string
      publish_release:
        description: Publish a GitHub release with the built assets
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  haskell-ghc-wasm:
    name: Build Haskell GHC WASM bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y curl zstd jq

      - name: Install ghc-wasm-meta
        env:
          FLAVOUR: ${{ inputs.ghc_wasm_flavour }}
        run: |
          curl -fsSL https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/raw/master/bootstrap.sh | sh
          "$HOME/.ghc-wasm/add_to_github_path.sh"

      - name: Build 10-package GHC WASM bundle
        run: |
          chmod +x scripts/build-ghc-wasm-bundle.sh
          scripts/build-ghc-wasm-bundle.sh dist-bundle "${{ inputs.version }}"

      - name: Smoke-test built bundle with dyld.mjs
        run: node scripts/smoke-test-ghc-wasm-bundle.mjs dist-bundle

      - uses: actions/upload-artifact@v6
        with:
          name: haskell-ghc-wasm-${{ inputs.version }}
          path: dist-bundle/

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="on-device-haskell-ghc-wasm-${{ inputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist-bundle/bsdtar.wasm \
              dist-bundle/rootfs.tar.zst \
              dist-bundle/SHA256SUMS \
              dist-bundle/bundle-manifest.json \
              --clobber
          else
            # Never mark bundle asset releases as "Latest" so `releases/latest` stays on `v*` app
            # releases used by `install.sh` and the in-app update checker.
            gh release create "$tag" \
              dist-bundle/bsdtar.wasm \
              dist-bundle/rootfs.tar.zst \
              dist-bundle/SHA256SUMS \
              dist-bundle/bundle-manifest.json \
              --latest=false \
              --title "On-device Haskell GHC WASM ${{ inputs.version }}" \
              --notes "Reproducible on-device runtime bundle built from workflow run ${{ github.run_id }}."
          fi
