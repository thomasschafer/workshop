# Builds release binaries for a tag and attaches them to its GitHub release, then publishes the
# release. Normally called by the release-plz workflow straight after it creates the tag and draft
# release; run it manually to retry a failed build for an existing tag, or as a dry run to build
# and check every binary from the current commit without publishing anything.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the existing GitHub release, e.g. v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the existing GitHub release, e.g. v0.1.0. Leave empty for a dry run.
        required: false
        type: string
      dry_run:
        description: Build and check the binaries without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: workshop

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check inputs
        if: ${{ !inputs.dry_run && !inputs.tag }}
        run: |
          echo "::error::Give a tag, or choose a dry run"
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      # No dependency caching anywhere in this workflow, so release artifacts can't be influenced by
      # caches written from other branches.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Store frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Download frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Each Linux target builds natively on a runner of the same architecture, so musl-gcc is
      # enough to compile C dependencies without a cross-compilation toolchain.
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        env:
          TAG: ${{ inputs.tag || 'dry-run' }}
          TARGET: ${{ matrix.target }}
        run: |
          name="${BINARY_NAME}-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="${BINARY_NAME}.exe"
          else
            exe="$BINARY_NAME"
          fi
          cp "target/$TARGET/release/$exe" LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="$name.zip"
            7z a "$archive" "$name"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify binary
        shell: bash
        working-directory: dist
        env:
          TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          mkdir verify
          case "$ARCHIVE" in
            *.zip) 7z x -y -o"verify" "$ARCHIVE" ;;
            *) tar -xzf "$ARCHIVE" -C verify ;;
          esac
          bin=$(find verify -type f \( -name "$BINARY_NAME" -o -name "$BINARY_NAME.exe" \))
          if [ -z "$bin" ]; then
            echo "::error::Binary not found in $ARCHIVE"
            exit 1
          fi
          output=$("$bin" --version)
          echo "$output"
          if [ -n "$TAG" ]; then
            expected="${TAG#v}"
          else
            expected=$(sed -n 's/^version = "\(.*\)"$/\1/p' ../Cargo.toml | head -n 1)
          fi
          if ! grep -qF "$expected" <<< "$output"; then
            echo "::error::Expected version $expected in --version output"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            file "$bin"
            if ! file "$bin" | grep -qE 'statically linked|static-pie linked'; then
              echo "::error::Linux binary is not statically linked"
              exit 1
            fi
          fi

      - name: Store archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error

  publish:
    name: Publish release
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: assets
        run: |
          archives=(*)
          sha256sum "${archives[@]}" | tee SHA256SUMS
          for archive in "${archives[@]}"; do
            sha256sum "$archive" > "$archive.sha256"
          done

      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --draft=false

  homebrew:
    name: Update the Homebrew formula
    if: ${{ !inputs.dry_run }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pushing to the tap needs a token with write access to it, HOMEBREW_TAP_TOKEN. Without
      # one, this says so rather than failing the release.
      - name: Update thomasschafer/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN isn't set, so the Homebrew formula wasn't updated."
            exit 0
          fi
          version="${TAG#v}"
          scripts/homebrew-formula.sh "$version" > workshop.rb
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/thomasschafer/homebrew-tap.git" tap
          cp workshop.rb tap/Formula/workshop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/workshop.rb
          if git diff --cached --quiet; then
            echo "The formula is already up to date."
            exit 0
          fi
          git commit -m "workshop ${version} (automated)"
          git push
