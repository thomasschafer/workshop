name: CI

# Pushes and pull requests check Linux, and macOS where most people run the server, with WebKit
# standing in for iPhones. Windows, and Chromium on macOS, add little on each push, so they only
# run when the workflow is run by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rust lints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          rust-components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  rust:
    name: Rust tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"name":"Linux","os":"ubuntu-latest"},{"name":"macOS","os":"macos-15"},{"name":"Windows","os":"windows-2025"}]' || '[{"name":"Linux","os":"ubuntu-latest"},{"name":"macOS","os":"macos-15"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # So the sample pack's Haskell items are checked, by the tests and by pack check, rather
      # than skipped. Ubuntu's GHC comes with the packages Haskell items can use.
      - name: Install GHC
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ghc

      - name: Test
        run: cargo test --locked

      - name: Check the sample pack
        if: runner.os == 'Linux'
        run: cargo run --locked -- pack check packs/sample
        env:
          WORKSHOP_HOME: ${{ runner.temp }}/workshop-home

      # Installs the latest release as the README says to.
      - name: Install script
        if: runner.os != 'Windows'
        run: |
          WORKSHOP_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/workshop" --version

  # End-to-end tests drive the real server and app in a browser, with a stand-in model and an
  # invented puzzle, so they need no network, model access or language toolchain beyond Python.
  e2e:
    name: Browser tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"name":"Linux, Chromium","os":"ubuntu-latest","browser":"chromium"},{"name":"Linux, WebKit","os":"ubuntu-latest","browser":"webkit"},{"name":"macOS, WebKit","os":"macos-15","browser":"webkit"},{"name":"macOS, Chromium","os":"macos-15","browser":"chromium"},{"name":"Windows, Chromium","os":"windows-2025","browser":"chromium"}]' || '[{"name":"Linux, Chromium","os":"ubuntu-latest","browser":"chromium"},{"name":"Linux, WebKit","os":"ubuntu-latest","browser":"webkit"},{"name":"macOS, WebKit","os":"macos-15","browser":"webkit"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build server
        run: cargo build --locked

      - name: Install browser
        working-directory: frontend
        shell: bash
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} ${{ matrix.browser }}

      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright test --project=${{ matrix.browser }}

      # What a failed browser test leaves: a screenshot and page snapshot for each, and the test
      # servers' logs.
      - name: Keep what the end-to-end tests left
        if: failure()
        working-directory: frontend
        run: node scripts/collect-e2e-logs.ts

      - name: Store what the end-to-end tests left
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ runner.os }}-${{ matrix.browser }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The one check branch rules require, so the jobs above can change without updating them.
  passed:
    name: CI passed
    if: always()
    needs: [lint, rust, e2e, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
