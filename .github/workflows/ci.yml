name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The frontend is embedded into the binary at compile time, so it must exist before any cargo build.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # So the sample pack's Haskell items are checked, by the tests and by pack check, rather
      # than skipped. Ubuntu's GHC comes with the packages Haskell items can use.
      - name: Install GHC
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ghc

      - name: Test
        run: cargo test --locked

      - name: Check the sample pack
        run: cargo run --locked -- pack check packs/sample
        env:
          WORKSHOP_HOME: ${{ runner.temp }}/workshop-home

      # End-to-end tests drive the real server and app in a browser, with a stand-in model and an
      # invented puzzle, so they need no network, model access or language toolchain beyond Python.
      - name: Build server
        run: cargo build --locked

      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      # Safari's engine, as a stand-in for iPhones.
      - name: End-to-end tests in WebKit
        working-directory: frontend
        run: npm run e2e:webkit

      # What a failed browser test leaves: a screenshot and page snapshot for each, and the test
      # servers' logs.
      - name: Keep what the end-to-end tests left
        if: failure()
        working-directory: frontend
        run: node scripts/collect-e2e-logs.ts

      - name: Store what the end-to-end tests left
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-linux
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Installs the latest release as the README says to.
      - name: Install script
        run: |
          WORKSHOP_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/workshop" --version

  # Most people run the server on a Mac, so its tests, the app's and the install script run there too.
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --locked

      - name: Build server
        run: cargo build --locked

      - name: Install browsers
        working-directory: frontend
        run: npx playwright install chromium webkit

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: End-to-end tests in WebKit
        working-directory: frontend
        run: npm run e2e:webkit

      # What a failed browser test leaves: a screenshot and page snapshot for each, and the test
      # servers' logs.
      - name: Keep what the end-to-end tests left
        if: failure()
        working-directory: frontend
        run: node scripts/collect-e2e-logs.ts

      - name: Store what the end-to-end tests left
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-macos
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install script
        run: |
          WORKSHOP_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/workshop" --version

  # The server can run on Windows, so its tests and the app's run there too: the end-to-end tests
  # run solutions in Python, so they show whether running them works.
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --locked

      - name: Build server
        run: cargo build --locked

      - name: Install browser
        working-directory: frontend
        run: npx playwright install chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      # What a failed browser test leaves: a screenshot and page snapshot for each, and the test
      # servers' logs.
      - name: Keep what the end-to-end tests left
        if: failure()
        working-directory: frontend
        run: node scripts/collect-e2e-logs.ts

      - name: Store what the end-to-end tests left
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-windows
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
