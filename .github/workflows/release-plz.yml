name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: github.repository_owner == 'thomasschafer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read released tag
        id: tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          count=$(jq 'length' <<< "$RELEASES")
          if [ "$count" != "1" ]; then
            echo "::error::Expected exactly one release, got $count: $RELEASES"
            exit 1
          fi
          echo "tag=$(jq -r '.[0].tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"

  # Events caused by GITHUB_TOKEN (such as the tag and release release-plz just created) don't
  # trigger other workflows, so the binaries are built by calling the release workflow directly
  # instead of relying on a `release` or `push: tags` trigger. This needs no extra secrets.
  build-release:
    name: Build release
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    # A called workflow only gets the secrets it's given.
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  release-pr:
    name: Release PR
    if: github.repository_owner == 'thomasschafer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Run release-plz
        uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release-pr
        env:
          # PRs opened with GITHUB_TOKEN don't trigger CI. Setting the optional RELEASE_PLZ_TOKEN
          # secret (a fine-grained PAT or app token with contents and pull-requests write access)
          # makes CI run on release PRs.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
