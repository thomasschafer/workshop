# Google's Antigravity CLI in headless mode, using the user's existing login.
#
# Antigravity has no way to run without tools, and neither its permission settings nor its
# sandbox reliably stops its shell tool, so each call runs in a directory of its own with a hook
# there that refuses every tool call before it runs: the model can ask for a tool, but only ever
# gets back an error. In case the hook ever lets one through, Workshop also watches the steps it
# reports, and stops it, using none of its reply, if a tool runs rather than being refused, or if
# it reports something Workshop doesn't recognise, which could be a new kind of tool.
# There's no flag for a system prompt either, so Workshop's instructions are that directory's
# AGENTS.md, which Antigravity reads as the project's rules.
#
# Antigravity still loads the user's own global config: their global rules, in
# ~/.gemini/AGENTS.md, as well as Workshop's instructions, their global hooks and their MCP
# servers. There's no way to skip it without skipping its login too, so the rules can change how
# it replies, though tools stay refused by the hook and stopped by Workshop's check.
#
# There's no `[agent]` command, so it can't be the author's writer, but it can be any model that
# runs without tools, such as the author's reviewer.
command = [
  "agy",
  "--model", "{model}",
  "--output-format", "stream-json",
  "--disable-slash-commands",
]
# With no -p, the prompt is read from stdin.
input = "stdin"
output = "antigravity-stream-json"
name = "Antigravity"
# The effort is part of each model's name.
edit_models = ["gemini-3.8-flash-medium", "gemini-4-neon-low"]
discuss_models = ["gemini-4-neon-high", "gemini-4-neon-medium"]
version_command = ["agy", "--version"]
# Fails when logged out.
auth_check_command = ["agy", "models"]
install_hint = "Install the Antigravity CLI (https://antigravity.google), then run `agy` once to log in."
# The hook's command is written for a Unix shell.
unix_only = true

[[files]]
path = "AGENTS.md"
contents = "{system_prompt}"

# Antigravity also reads the rules of the git repository it's in, looking up from the directory
# it runs in, such as the AGENTS.md of a checkout of Workshop that a development build keeps its
# data in. A .git file pointing nowhere makes the directory a repository's root of its own, so
# none are found above it; an empty .git directory doesn't.
[[files]]
path = ".git"
contents = "gitdir: /nonexistent\n"

# Refuses every tool, whatever its name, including any added later.
[[files]]
path = ".agents/hooks.json"
contents = '''
{{
  "no-tools": {{
    "PreToolUse": [
      {{
        "matcher": "*",
        "hooks": [
          {{
            "type": "command",
            "command": "printf '{{\"decision\":\"deny\",\"reason\":\"Tools are turned off.\"}}'",
            "timeout": 5
          }}
        ]
      }}
    ]
  }}
}}
'''
