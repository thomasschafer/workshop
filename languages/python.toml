name = "Python"
# Selects syntax highlighting in the editor.
editor_mode = "python"
lsp_language_id = "python"

# Relative to the solutions directory.
file = "{year}/day{day:02}/main.py"

# The puzzle input is passed on stdin. Each line of stdout is read as the answer to that part:
# line 1 for part 1, line 2 for part 2.
run = ["python3", "{file}"]

lsp = ["pyright-langserver", "--stdio"]

template = '''
import sys


def part1(data: str) -> int:
    raise NotImplementedError


def part2(data: str) -> int:
    raise NotImplementedError


if __name__ == "__main__":
    data = sys.stdin.read()
    print(part1(data))
    # When you start part 2, uncomment the next line.
    # print(part2(data))
'''

dictation_hints = '''
- Indentation is significant. A line ending in a colon (def, for, if, while, with, else) opens a block, and the next line is indented one level (four spaces) further. "New line" continues at the current indentation; "dedent" or "back out" goes out one level.
- Names are snake_case: "count trees" is `count_trees`. Numbers in names are spoken as words but written as digits: "part one" is `part1`, unless a name in the file already says otherwise.
- "dot" between names is attribute access, `data.splitlines()`, never composition. "of" or "call" means a call: "len of lines" is `len(lines)`, and "sorted of nums" is `sorted(nums)`.
- "equals" is `=`, "double equals" is `==`, "not equals" is `!=`, "plus equals" is `+=`; "colon" at the end of a line is `:`.
- "list of x for x in xs" or "list comp x for x in xs" is `[x for x in xs]`; "set of" and "dict of" work the same way with `{...}`. "f string" starts an f-string.
- "lambda x colon x times two" is `lambda x: x * 2`.
- "return" starts a return statement; "pass" and "None", "True" and "False" are keywords.
- "Wrap that in f" applies f to the whole of the most recent expression: wrapping `data.split()` in `sorted` gives `sorted(data.split())`.
- The user's own helpers module is `aoc`: "from AOC import ints" is `from aoc import ints`. Imports go with the others at the top, wherever the cursor is. Package names with hyphens are imported with underscores: "import more itertools" is `import more_itertools`.
- Common mishearings: "in put" is `input`, "split lines" is `splitlines`, "enumerate" may be heard as "e numerate", "deck" or "deque" is `deque`.
'''

# When part 1 is solved, the template's part 2 line is offered to be turned on.
start_part_two = { find = """
    # When you start part 2, uncomment the next line.
    # print(part2(data))""", replace = """
    print(part2(data))""" }

# A module of your own that every solution can import, created with your first solution unless
# it's already there.
[helpers]
file = "lib/aoc.py"
# A line defining a helper, with its name: a function at the start of a line.
definition = "^def ([A-Za-z_][A-Za-z0-9_]*)\\("
environment = { PYTHONPATH = "{helpers}" }
# Tells Pyright where the module is, unless you have a pyrightconfig.json already.
lsp_config = { file = "pyrightconfig.json", text = """
{
  "extraPaths": ["lib"]
}
""" }
template = '''
"""Helpers your solutions can share: `from aoc import ints` to use them, and add your own."""

import re


def ints(text: str) -> list[int]:
    """Every integer in the text, including negative ones: ints("x=-3, y=12") == [-3, 12]."""
    return [int(n) for n in re.findall(r"-?\d+", text)]


def grid(text: str) -> dict[tuple[int, int], str]:
    """A grid of characters by (row, column), from lines of text."""
    return {(r, c): ch for r, line in enumerate(text.splitlines()) for c, ch in enumerate(line)}


def neighbours4(r: int, c: int) -> list[tuple[int, int]]:
    """The positions above, below, left and right."""
    return [(r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)]


def neighbours8(r: int, c: int) -> list[tuple[int, int]]:
    """The positions around, diagonals included."""
    return [(r + dr, c + dc) for dr in (-1, 0, 1) for dc in (-1, 0, 1) if (dr, dc) != (0, 0)]
'''

# Setup offers to install the programs above with mise (https://mise.jdx.dev) when they're
# missing, into the solutions directory only. This is the mise.toml it writes there, unless one is
# there already. Programs you have installed already are used as they are.
[toolchain]
mise = '''
# The programs these solutions are run with, installed by mise for this directory only. Run
# `mise install` to install them, and see https://mise.jdx.dev to use them in your shell.
[tools]
python = "3.13"
# Pyright, the language server for error underlines and types, runs on Node.
node = "lts"
"npm:pyright" = "latest"
'''

[packages]
# Relative to the solutions directory. One package per line; edit it by hand or in the app.
manifest = "python-packages.txt"
# The standard library covers most puzzles, so nothing is installed until you add something.
defaults = []
# A virtual environment, which `python3` runs in once it's first on PATH. Pyright finds it the
# same way.
install = [
  ["python3", "-m", "venv", "{env}/venv"],
  ["{env}/venv/{venv_bin}/python", "-m", "pip", "install", "--quiet", "--disable-pip-version-check", "{packages}"],
]
environment = { PATH = "{env}/venv/{venv_bin}{path_sep}{PATH}", VIRTUAL_ENV = "{env}/venv" }
missing_module = [
  "No module named '([A-Za-z0-9_.]+)'",
  "Import \"([A-Za-z0-9_.]+)\" could not be resolved",
]
# Most packages are named after the module they provide. PyPI is checked first, so a module
# of your own isn't mistaken for a package.
package_named_after_module = true
lookup = { service = "pypi" }

# The exceptions, by module prefix.
[packages.providers]
"PIL" = "pillow"
"bs4" = "beautifulsoup4"
"cv2" = "opencv-python"
"dateutil" = "python-dateutil"
"sklearn" = "scikit-learn"
"yaml" = "pyyaml"
