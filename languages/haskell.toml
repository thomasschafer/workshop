name = "Haskell"
# Selects syntax highlighting in the editor.
editor_mode = "haskell"
lsp_language_id = "haskell"

# Relative to the solutions directory.
file = "{year}/day{day:02}/Main.hs"

# Commands are lists of arguments, not shell strings. Placeholders: {file}, {dir} (the file's
# directory), {build_dir} (a scratch directory outside the solutions repo), {year}, {day}.
# The puzzle input is passed on stdin. Each line of stdout is read as the answer to that part:
# line 1 for part 1, line 2 for part 2.
build = ["ghc", "-O2", "-v0", "-outputdir", "{build_dir}", "-o", "{build_dir}/main", "{file}"]
run = ["{build_dir}/main"]

lsp = ["haskell-language-server-wrapper", "--lsp"]

template = '''
module Main where

main :: IO ()
main = do
  input <- getContents
  print (part1 input)
  -- When you start part 2, uncomment the next line.
  -- print (part2 input)

part1 :: String -> Int
part1 = undefined

part2 :: String -> Int
part2 = undefined
'''

dictation_hints = '''
- "dot" between functions is composition ` . `; "dollar" is ` $ `; "fmap operator" or "angle dollar" is `<$>`; "bind" is `>>=`; "cons" is `:`; "append" or "plus plus" is `++`.
- "lambda x arrow ..." is `\x -> ...`.
- "from A to B" in a type signature means `A -> B`; "list of Int" is `[Int]`; "maybe Int" is `Maybe Int`.
- "function solve from String to Int" means a signature line `solve :: String -> Int` followed by a definition line `solve = ‸`.
- "where" adds a `where` clause below the current definition, indented; "new line" starts a new line at the current indentation.
- Users often build pipelines right to left. "Before that X" inserts X to the left of the most recent insertion and leaves the cursor just before X. Starting from `solve = sum‸`, "before that dot" gives `solve = ‸. sum`, and then "before that map read" gives `solve = ‸map read . sum`.
- "Wrap that in parens" or "bracket that" puts parentheses around the most recent expression. "Wrap that in f" applies f to the whole of it, adding brackets as needed: wrapping `part1 input` in `show` gives `show (part1 input)`.
- Numbers in names are spoken as words but written as digits: "part one" is `part1`, "day two" is `day2`, unless a name in the file already says otherwise.
- Common mishearings: "fold are" or "fold R" is `foldr`, "fold L prime" is `foldl'`, "map M underscore" is `mapM_`, "in pew" is `input`, "read MaybeD" is `readMaybe`.
'''

[packages]
# Relative to the solutions directory. One package per line; edit it by hand or in the app.
manifest = "haskell-packages.txt"
# Hackage packages that come up often in Advent of Code and build quickly. GHC's own packages,
# such as containers, are listed too: with a package environment, only listed packages are
# visible. vector and the like are left out because they take minutes to build.
defaults = [
  "containers",
  "unordered-containers",
  "split",
  "array",
  "mtl",
  "transformers",
  "text",
  "bytestring",
  "parsec",
  "deepseq",
]
# A GHC package environment, which ghc and haskell-language-server both read.
install = [
  ["cabal", "install", "--lib", "--package-env", "{env}/ghc-environment", "{packages}"],
]
update = { command = ["cabal", "update"], every_hours = 24 }
environment = { GHC_ENVIRONMENT = "{env}/ghc-environment" }
missing_module = ["Could not (?:find|load) module [‘'`]([A-Za-z0-9_.]+)[’'`]"]
# A package that's installed but not listed, such as one that comes with GHC.
missing_package = ["member of the hidden package [‘'`]([A-Za-z0-9_.-]+?)-[0-9][0-9.]*[’'`]"]
# For modules that aren't in the list below.
lookup = { service = "hoogle" }

# Which package provides a module, by module prefix; the longest match wins.
[packages.providers]
"Algorithm.Search" = "search-algorithms"
"Control.DeepSeq" = "deepseq"
"Control.Lens" = "lens"
"Control.Monad.Except" = "mtl"
"Control.Monad.RWS" = "mtl"
"Control.Monad.Reader" = "mtl"
"Control.Monad.State" = "mtl"
"Control.Monad.Writer" = "mtl"
"Control.Parallel" = "parallel"
"Data.Array" = "array"
"Data.ByteString" = "bytestring"
"Data.Graph" = "containers"
"Data.Graph.Inductive" = "fgl"
"Data.HashMap" = "unordered-containers"
"Data.HashSet" = "unordered-containers"
"Data.Hashable" = "hashable"
"Data.Heap" = "heaps"
"Data.IntMap" = "containers"
"Data.IntSet" = "containers"
"Data.List.Split" = "split"
"Data.Map" = "containers"
"Data.Matrix" = "matrix"
"Data.MemoTrie" = "MemoTrie"
"Data.PQueue" = "pqueue"
"Data.Sequence" = "containers"
"Data.Set" = "containers"
"Data.Text" = "text"
"Data.Tree" = "containers"
"Data.Vector" = "vector"
"Linear" = "linear"
"Math.NumberTheory" = "arithmoi"
"Text.Megaparsec" = "megaparsec"
"Text.Parsec" = "parsec"
"Text.Regex.TDFA" = "regex-tdfa"
